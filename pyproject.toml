[project]
name = "vigil"
version = "0.1.0"
description = "Vigil -- exchange regulatory reporting and surveillance"
requires-python = ">=3.12"
dependencies = [
    "snowflake-connector-python>=3.12",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pandas>=2.2",
    "tabulate>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
